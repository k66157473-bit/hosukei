<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爆速コイン歩数計 (Ajaxリアルタイム通信)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; background: #000; color: #fff; margin: 0; padding: 10px; overflow-x: hidden; }
        .container { max-width: 400px; margin: 10px auto; padding: 15px; border-radius: 20px; background: #111; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        #shiftTarget { position: relative; transition: all 0.5s ease; }
        
        .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .stat-box { background: #1a1a1a; padding: 12px; border-radius: 12px; border: 1px solid #333; }
        .stat-label { font-size: 0.8rem; color: #aaa; }
        .steps { font-size: 2.2rem; font-weight: bold; color: #00cc66; }
        .coins { font-size: 2.2rem; font-weight: bold; color: #ffcc00; }
        
        button { background: #00cc66; color: #000; border: none; padding: 14px 28px; font-size: 1.1rem; border-radius: 30px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px; }
        button:active { background: #00994d; }
        .status { color: #666; font-size: 0.8rem; line-height: 1.4; }
        
        /* 🔥 Ajax通信ステータス表示 */
        .api-status { margin-top: 10px; padding: 8px; border-radius: 8px; font-size: 0.8rem; background: #222; border: 1px solid #444; color: #aaa; font-family: monospace; }
        .api-success { color: #00ff88; font-weight: bold; }
        .api-error { color: #ff3366; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div id="shiftTarget">
            
            <div class="grid-stats">
                <div class="stat-box">
                    <div class="stat-label">本日の歩数</div>
                    <!-- 0.5歩単位を表現するため小数点第1位まで表示 -->
                    <div class="steps" id="stepDisplay">0.0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">獲得コイン</div>
                    <div class="coins" id="coinDisplay">0</div>
                </div>
            </div>

            <button id="startBtn">センサー接続＆計測開始</button>
            <div class="status" id="statusText">ボタンを押すと、画面焼き付き防止・スリープ防止が同時に起動します。</div>

            <!-- 🔥 Ajax同期ログ -->
            <div class="api-status">
                <span>サーバー同期状況: </span><span id="syncText">待機中</span>
            </div>
        </div>
    </div>

    <script>
        function getTodayString() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        const todayKey = getTodayString();
        let trackingData = JSON.parse(localStorage.getItem('pedometer_logs')) || {};
        if (!trackingData[todayKey]) { trackingData[todayKey] = { steps: 0.0, coins: 0 }; }

        const stepDisplay = document.getElementById('stepDisplay');
        const coinDisplay = document.getElementById('coinDisplay');
        const startBtn = document.getElementById('startBtn');
        const statusText = document.getElementById('statusText');
        const shiftTarget = document.getElementById('shiftTarget');
        const syncText = document.getElementById('syncText');

        function updateUI() {
            stepDisplay.textContent = trackingData[todayKey].steps.toFixed(1);
            coinDisplay.textContent = trackingData[todayKey].coins.toLocaleString(); // カンマ区切り
        }
        updateUI();

        let wakeLock = null;
        let lastMagnitude = 0;
        let isPeak = false;
        const THRESHOLD = 11.0; // 高感度設定

        // 🔥 【新機能】Ajax（Fetch API）によるリアルタイム非同期更新
        async function syncDataWithServer(steps, coins) {
            syncText.className = '';
            syncText.textContent = "同期中...";

            // ⚠️ 送信先サーバーのURL（あなたのバックエンドAPIのURLに書き換えてください）
            const API_URL = 'https://example.com'; 

            try {
                // 現代のAjax（Fetch API）を使った非同期POST送信
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        date: todayKey,
                        steps: steps,
                        coins: coins,
                        timestamp: Date.now()
                    })
                });

                if (response.ok) {
                    syncText.className = 'api-success';
                    syncText.textContent = "成功 🟢 (画面リロードなしで完了)";
                } else {
                    throw new Error('サーバーエラー');
                }
            } catch (error) {
                // テスト用にURLがダミー（example.com）なので、最初は必ずここを通ります（動作は正常です）
                syncText.className = 'api-error';
                syncText.textContent = "通信エラー ❌ (ローカルには保存済)";
                console.log("Ajax送信エラー（ローカル保存は成功しています）:", error.message);
            }
        }

        // 🔥 【新機能】0.5歩で160コイン加算ロジック
        function addHalfStep() {
            // 0.5歩を加算
            trackingData[todayKey].steps += 0.5;
            // 160コインを加算
            trackingData[todayKey].coins += 160;

            // ローカル（LocalStorage）に即座にバックアップ
            localStorage.setItem('pedometer_logs', JSON.stringify(trackingData));
            updateUI();

            // リアルタイムにAjaxで非同期サーバー送信（画面は一切カクつきません）
            syncDataWithServer(trackingData[todayKey].steps, trackingData[todayKey].coins);
        }

        // センサー監視
        function handleMotion(event) {
            const acc = event.accelerationIncludingGravity;
            if (!acc) return;
            const magnitude = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);

            // 1回のピーク（半歩分の動き）を検知
            if (magnitude > THRESHOLD && magnitude < lastMagnitude && !isPeak) {
                addHalfStep();
                isPeak = true;
                setTimeout(() => { isPeak = false; }, 300); // 連続カウント防止
            }
            lastMagnitude = magnitude;
        }

        // スリープ防止
        async function requestWakeLock() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        }

        // 開始ボタン処理
        startBtn.addEventListener('click', async () => {
            await requestWakeLock();
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceMotionEvent.requestPermission();
                    if (permissionState === 'granted') {
                        window.addEventListener('devicemotion', handleMotion);
                        startBtn.style.display = 'none';
                        statusText.innerHTML = "🟢 計測中。30秒ごとにピクセルシフトが起動します。";
                    }
                } catch (e) { alert('センサーの起動に失敗しました'); }
            } else {
                window.addEventListener('devicemotion', handleMotion);
                startBtn.style.display = 'none';
                statusText.innerHTML = "🟢 計測中。30秒ごとにピクセルシフトが起動します。";
            }
        });

        // ピクセルシフト（焼き付き対策）
        setInterval(() => {
            const maxShift = 5; 
            const shiftX = Math.floor(Math.random() * (maxShift * 2 + 1)) - maxShift;
            const shiftY = Math.floor(Math.random() * (maxShift * 2 + 1)) - maxShift;
            shiftTarget.style.transform = `translate(${shiftX}px, ${shiftY}px)`;
        }, 30000);
    </script>
</body>
</html>
