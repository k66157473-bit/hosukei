<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケット歩数計 (ピクセルシフト搭載)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; background: #000; color: #fff; margin: 0; padding: 20px; overflow: hidden; }
        /* 焼き付き対策のため、全体的にコントラストを抑えた配色にしています */
        .container { max-width: 400px; margin: 50px auto; padding: 20px; border-radius: 20px; background: #111; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        /* ピクセルシフトの対象となるコンテナ（位置を動かす） */
        #shiftTarget { position: relative; transition: all 0.5s ease; }
        
        .steps { font-size: 5rem; font-weight: bold; color: #00cc66; margin: 30px 0; }
        .notice { background: #b3241e; color: #fff; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 0.9rem; margin-bottom: 20px; }
        button { background: #00cc66; color: #000; border: none; padding: 16px 32px; font-size: 1.2rem; border-radius: 30px; cursor: pointer; font-weight: bold; width: 100%; }
        button:active { background: #00994d; }
        .status { color: #666; font-size: 0.85rem; margin-top: 15px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 焼き付き防止のため、この枠全体の位置を定期的に微変動させます -->
        <div id="shiftTarget">
            <div class="notice">⚠️ 計測中は画面を閉じないでください</div>
            <h2>本日の歩数</h2>
            <div class="steps" id="stepDisplay">0</div>
            <button id="startBtn">計測を開始する</button>
            <div class="status" id="statusText">
                ボタンを押すと画面のスリープを防止し、<br>ポケット内での計測を開始します。
            </div>
        </div>
    </div>

    <script>
        let steps = parseInt(localStorage.getItem('pwa_steps')) || 0;
        const stepDisplay = document.getElementById('stepDisplay');
        const startBtn = document.getElementById('startBtn');
        const statusText = document.getElementById('statusText');
        const shiftTarget = document.getElementById('shiftTarget');

        stepDisplay.textContent = steps;

        let wakeLock = null;
        let lastMagnitude = 0;
        let isPeak = false;
        const THRESHOLD = 12.5; 

        // 1. 【新機能】ピクセルシフト（焼き付き防止ロジック）
        function applyPixelShift() {
            // 上下左右に -5px 〜 +5px の範囲でランダムに変位させる
            const maxShift = 5; 
            const shiftX = Math.floor(Math.random() * (maxShift * 2 + 1)) - maxShift;
            const shiftY = Math.floor(Math.random() * (maxShift * 2 + 1)) - maxShift;
            
            // CSSのtransformを使って位置をずらす
            shiftTarget.style.transform = `translate(${shiftX}px, ${shiftY}px)`;
            console.log(`ピクセルシフト実行: X=${shiftX}px, Y=${shiftY}px`);
        }

        // 30秒（30000ミリ秒）ごとに位置をずらすタイマーを設定
        setInterval(applyPixelShift, 30000);


        // 2. 画面のスリープを防止する関数
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Screen Wake Lock is active');
                }
            } catch (err) {
                console.error(`スリープ防止エラー: ${err.name}, ${err.message}`);
            }
        }

        // 3. 歩数カウント処理
        function handleMotion(event) {
            const acc = event.accelerationIncludingGravity;
            if (!acc) return;

            const magnitude = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);

            if (magnitude > THRESHOLD && magnitude < lastMagnitude && !isPeak) {
                steps++;
                stepDisplay.textContent = steps;
                localStorage.setItem('pwa_steps', steps);
                isPeak = true;
                setTimeout(() => { isPeak = false; }, 350); 
            }
            lastMagnitude = magnitude;
        }

        // 4. 開始ボタン処理
        startBtn.addEventListener('click', async () => {
            await requestWakeLock();

            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceMotionEvent.requestPermission();
                    if (permissionState === 'granted') {
                        window.addEventListener('devicemotion', handleMotion);
                        startBtn.style.display = 'none';
                        statusText.innerHTML = "🟢 スリープ防止＆ピクセルシフト作動中。<br>画面を開いたままポケットに入れてください。";
                    } else {
                        alert('センサーが拒否されました');
                    }
                } catch (e) {
                    console.error(e);
                }
            } else {
                window.addEventListener('devicemotion', handleMotion);
                startBtn.style.display = 'none';
                statusText.innerHTML = "🟢 スリープ防止＆ピクセルシフト作動中。<br>画面を開いたままポケットに入れてください。";
            }
        });

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });
    </script>
</body>
</html>
